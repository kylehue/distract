<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Loading</title>
      <style>
         html,
         body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #101014;
            font-family:
               Inter,
               system-ui,
               -apple-system,
               "Segoe UI",
               Roboto,
               "Noto Sans",
               "Source Sans 3",
               "Helvetica Neue",
               Arial,
               sans-serif;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.82);
            user-select: none;
         }

         .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
         }

         .card {
            width: 100%;
            height: 100%;
            background: #101014;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
         }

         .title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.3px;
         }

         .subtitle {
            font-size: 0.8rem;
            opacity: 0.7;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <div class="card">
            <img
               src="./distract-animated.svg"
               width="64px"
               alt="Distract"
               draggable="false"
            />
            <div class="title">Starting Distract</div>
            <div class="subtitle"></div>
         </div>
      </div>

      <script defer>
         window.splash?.onStatus((text) => {
            const el = document.querySelector(".subtitle");
            if (el) el.textContent = text;
         });
      </script>
   </body>
</html>
